<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StumpCast Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    background: #060c16;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Animated background radial glows */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 60%, rgba(25, 211, 197, 0.08) 0%, transparent 70%),
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(30, 80, 200, 0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(200, 50, 100, 0.04) 0%, transparent 60%);
    animation: bgPulse 4s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes bgPulse {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* Scanline overlay for broadcast feel */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.03) 2px,
      rgba(0, 0, 0, 0.03) 4px
    );
    pointer-events: none;
  }

  .container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    animation: fadeInUp 0.6s ease-out both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Stump icon SVG */
  .logo-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    margin-bottom: 28px;
  }

  .logo-glow {
    position: absolute;
    inset: -20px;
    background: radial-gradient(circle, rgba(25, 211, 197, 0.25) 0%, transparent 65%);
    animation: glowPulse 2s ease-in-out infinite alternate;
    border-radius: 50%;
  }

  @keyframes glowPulse {
    0%  { opacity: 0.5; transform: scale(0.95); }
    100% { opacity: 1;  transform: scale(1.05); }
  }

  .logo-svg {
    position: relative;
    width: 120px;
    height: 120px;
    filter: drop-shadow(0 0 18px rgba(25, 211, 197, 0.7));
    animation: logoEntry 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
  }

  @keyframes logoEntry {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }

  .app-name {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #ffffff;
    line-height: 1;
    animation: fadeInUp 0.6s ease-out 0.3s both;
  }

  .app-name span {
    color: #19D3C5;
  }

  .tagline {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    animation: fadeInUp 0.6s ease-out 0.45s both;
  }

  /* Live broadcast badge */
  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(220, 38, 38, 0.15);
    border: 1px solid rgba(220, 38, 38, 0.35);
    animation: fadeInUp 0.6s ease-out 0.55s both;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ef4444;
    animation: blink 1.1s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.2; }
  }

  .live-text {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #f87171;
  }

  /* Progress bar area */
  .progress-area {
    margin-top: 52px;
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: fadeInUp 0.6s ease-out 0.6s both;
  }

  .progress-track {
    height: 3px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #19D3C5, #3b82f6, #19D3C5);
    background-size: 200% 100%;
    animation: progressSweep 2.5s ease-in-out infinite;
    width: 0%;
    transition: width 0.4s ease;
  }

  @keyframes progressSweep {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .status-text {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.3);
    text-align: center;
    min-height: 16px;
    transition: opacity 0.3s ease;
  }

  /* Version tag */
  .version {
    position: fixed;
    bottom: 20px;
    right: 24px;
    font-size: 10px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 1px;
  }

  /* Signal arcs decoration */
  .signal-arcs {
    position: fixed;
    top: -60px;
    right: -60px;
    width: 300px;
    height: 300px;
    opacity: 0.06;
    animation: rotateSlow 20s linear infinite;
  }

  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<!-- Decorative rotating arcs -->
<svg class="signal-arcs" viewBox="0 0 300 300" fill="none">
  <circle cx="150" cy="150" r="60"  stroke="#19D3C5" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="150" cy="150" r="100" stroke="#19D3C5" stroke-width="1.5" stroke-dasharray="5 8"/>
  <circle cx="150" cy="150" r="140" stroke="#19D3C5" stroke-width="1" stroke-dasharray="4 10"/>
</svg>

<div class="container">
  <div class="logo-wrap">
    <div class="logo-glow"></div>
    <svg class="logo-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Background circle -->
      <circle cx="60" cy="60" r="58" fill="#0d1117" stroke="rgba(25,211,197,0.2)" stroke-width="1.5"/>
      <!-- Cricket stumps -->
      <rect x="28" y="42" width="10" height="44" rx="3" fill="#19D3C5"/>
      <rect x="55" y="38" width="10" height="48" rx="3" fill="#19D3C5"/>
      <rect x="82" y="42" width="10" height="44" rx="3" fill="#19D3C5"/>
      <!-- Bails -->
      <rect x="24" y="38" width="18" height="5" rx="2.5" fill="#19D3C5" opacity="0.85"/>
      <rect x="51" y="34" width="18" height="5" rx="2.5" fill="#19D3C5" opacity="0.85"/>
      <rect x="78" y="38" width="18" height="5" rx="2.5" fill="#19D3C5" opacity="0.85"/>
      <!-- Broadcast signal arcs -->
      <path d="M47 26 Q60 16 73 26" stroke="#19D3C5" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M40 20 Q60 7 80 20" stroke="#19D3C5" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.55"/>
    </svg>
  </div>

  <div class="app-name">Stump<span>Cast</span> Studio</div>
  <div class="tagline">Live Cricket Broadcast Producer</div>

  <div class="live-badge">
    <div class="live-dot"></div>
    <span class="live-text">On Air Ready</span>
  </div>

  <div class="progress-area">
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">Initializing broadcast engine…</div>
  </div>
</div>

<div class="version" id="appVersion">v1.0.7</div>

<script>
  // Dynamically reflect current version from URL params or runtime setter
  try {
    const params = new URLSearchParams(window.location.search);
    const v = params.get('v');
    if (v) {
      const verEl = document.getElementById('appVersion') || document.querySelector('.version');
      if (verEl) verEl.textContent = v.startsWith('v') ? v : `v${v}`;
    }
  } catch {}

  window.setSplashVersion = function(v) {
    if (!v) return;
    const verEl = document.getElementById('appVersion') || document.querySelector('.version');
    if (verEl) verEl.textContent = v.startsWith('v') ? v : `v${v}`;
  };

  const bar = document.getElementById('progressBar');
  const txt = document.getElementById('statusText');

  const steps = [
    [8,  'Starting broadcast server…'],
    [20, 'Loading match engine…'],
    [38, 'Registering WebSocket hub…'],
    [55, 'Preparing overlay graphics…'],
    [72, 'Loading card catalog…'],
    [85, 'Connecting OBS pipeline…'],
    [95, 'Almost ready…'],
  ];

  let i = 0;
  function tick() {
    if (i < steps.length) {
      const [pct, msg] = steps[i++];
      bar.style.width = pct + '%';
      txt.textContent = msg;
      setTimeout(tick, 600 + Math.random() * 400);
    }
  }
  tick();

  // IPC from main process to update progress
  if (window.__stumpcast?.onSplashProgress) {
    window.__stumpcast.onSplashProgress((pct, msg) => {
      bar.style.width = pct + '%';
      if (msg) txt.textContent = msg;
    });
  }
</script>
</body>
</html>
