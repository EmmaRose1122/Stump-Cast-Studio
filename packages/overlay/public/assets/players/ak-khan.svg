          <stop offset="0%" stop-color="#0f172a"/>
          <stop offset="60%" stop-color="#1e293b"/>
          <stop offset="100%" stop-color="#DB161B"/>
        </linearGradient>
      </defs>
      <circle cx="100" cy="100" r="98" fill="#008000" stroke="#ffffff" stroke-width="3"/>
      <g clip-path="url(#circle)">
        <rect width="200" height="200" fill="url(#bg)"/>
        <!-- Torso / Jersey -->
        <path d="M30,200 C35,145 65,135 100,135 C135,135 165,145 170,200 Z" fill="#DB161B"/>
        <path d="M85,135 L100,165 L115,135 Z" fill="#008000"/>
