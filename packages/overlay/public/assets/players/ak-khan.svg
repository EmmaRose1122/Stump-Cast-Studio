        <rect x="85" y="110" width="30" height="30" rx="6" fill="#b5825a"/>
        <!-- Head -->
        <ellipse cx="100" cy="85" rx="36" ry="44" fill="#b5825a"/>
        <!-- Hair -->
        <path d="M64,80 C62,45 80,35 100,35 C120,35 138,45 136,80 C125,50 75,50 64,80 Z" fill="#181818"/>
        <!-- Eyes -->
        <ellipse cx="86" cy="82" rx="4" ry="3" fill="#1e293b"/>
        <ellipse cx="114" cy="82" rx="4" ry="3" fill="#1e293b"/>
        <!-- Eyebrows -->
        <path d="M78,74 Q86,70 94,74" stroke="#181818" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M106,74 Q114,70 122,74" stroke="#181818" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <!-- Nose -->
        <path d="M100,80 L97,94 L104,94" stroke="#d49b70" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- Beard / Mouth -->
        
          <path d="M72,88 C70,122 85,133 100,133 C115,133 130,122 128,88 C122,118 78,118 72,88 Z" fill="#181818" opacity="0.85"/>
          <path d="M92,108 Q100,113 108,108" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        
        <!-- Team Badge on Chest -->
        <circle cx="135" cy="175" r="14" fill="#008000"/>
        <text x="135" y="180" font-family="sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">OMA</text>
      </g>
